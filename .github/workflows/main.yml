name: Create and Publish Horror Episode

on:
  schedule:
    # الـ workflow بيتشغّل الساعة 13:30 UTC (16:30 القاهرة، UTC+3) —
    # ده معاد بدء التوليد بس، مش معاد النشر الفعلي؛ النشر نفسه مجدول
    # (dueAt عند Buffer، publishAt عند يوتيوب) على معاد واحد تحت.
    #
    # التحديث الجديد: الفيديو الكامل والريل الواحد (المأخوذ من أول
    # الحلقة) بينشروا مع بعض في نفس اللحظة، مساءً الساعة ~7م (تأخير 8
    # ساعات من وقت تشغيل الـ workflow صباحًا). لم يعد هناك short_2 ولا
    # جدولة منفصلة للشورت — كل الأصول (الفيديو + الريل على كل منصة)
    # تستخدم نفس FULL_VIDEO_DELAY_HOURS.
    - cron: "30 13 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and validate without publishing externally"
        required: false
        default: false
        type: boolean

# Actions v5/v6 already target Node.js 24. Keep this explicit so GitHub does
# not fall back to the deprecated Node.js 20 runtime for any transitive action.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# يمنع تشغيل حلقتين في الوقت نفسه، ولا يلغي التشغيل الجاري.
concurrency:
  group: horror-episode-pipeline
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version
          ffprobe -version

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Verify Edge TTS installation
        run: python -c "import edge_tts; print('edge-tts import OK:', getattr(edge_tts, '__version__', 'installed'))"

      # فشل الـ import هنا صامت لو حصل من غير السطر ده — pip منفصل عن
      # "python -m pip" ممكن يثبّت الحزم على تفسير Python مختلف عن اللي
      # بيشغّل main.py فعليًا، فيرجع realign_subtitles_with_whisper()
      # بصمت لتوقيتات edge-tts الأقل دقة (سبب عدم تزامن الترجمة اللي
      # ظهر قبل كده). السطر ده بيفشل الـ run فورًا وبوضوح لو تكرر نفس
      # الخطأ، بدل ما يتخبى جوه try/except ويكمّل بجودة أقل من غير تنبيه.
      - name: Verify faster-whisper is importable on the same interpreter
        run: python -c "import faster_whisper; print('faster-whisper OK:', faster_whisper.__file__)"

      - name: Verify Arabic narration guard
        run: python -m unittest tests.test_arabic_guard -v

      - name: Discover currently available LLM models
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          python - <<'PY'
          import json, os, urllib.parse, urllib.request

          def get(url, headers=None):
              req = urllib.request.Request(url, headers=headers or {})
              with urllib.request.urlopen(req, timeout=20) as r:
                  return json.load(r)

          # لا نفترض أن اسم موديل الأمس ما زال موجودًا؛ نقرأ الكتالوج الحالي.
          gemini = []
          if os.environ.get("GEMINI_API_KEY"):
              try:
                  data = get("https://generativelanguage.googleapis.com/v1beta/models?" + urllib.parse.urlencode({"key": os.environ["GEMINI_API_KEY"]}))
                  gemini = [m["name"].removeprefix("models/") for m in data.get("models", [])
                            if "generateContent" in m.get("supportedGenerationMethods", [])]
              except Exception as e:
                  print(f"::warning::Gemini model discovery failed: {e}")
          gemini = [m for m in gemini if "gemini" in m.lower() and "embedding" not in m.lower()]
          if gemini:
              # جرّب النماذج الأحدث أولًا، مع إبقاء كل المرشحين المتاحين للـ fallback.
              gemini.sort(reverse=True)
              os.environ["GEMINI_MODELS"] = ",".join(gemini[:12])

          groq = []
          if os.environ.get("GROQ_API_KEY"):
              try:
                  data = get("https://api.groq.com/openai/v1/models", {"Authorization": "Bearer " + os.environ["GROQ_API_KEY"]})
                  groq = [m["id"] for m in data.get("data", []) if m.get("active", True)]
              except Exception as e:
                  print(f"::warning::Groq model discovery failed: {e}")
          chat_markers = ("llama", "qwen", "gemma", "mixtral", "deepseek", "gpt")
          groq = [m for m in groq if any(x in m.lower() for x in chat_markers)
                  and not any(x in m.lower() for x in ("whisper", "guard", "compound"))]
          if groq:
              os.environ["GROQ_MODELS"] = ",".join(groq[:12])
              os.environ["GROQ_MODEL"] = groq[0]

          router = []
          try:
              data = get("https://openrouter.ai/api/v1/models", {"Authorization": "Bearer " + os.environ.get("OPENROUTER_API_KEY", "")})
              for model in data.get("data", []):
                  pricing = model.get("pricing", {})
                  if str(pricing.get("prompt", "")) == "0" and str(pricing.get("completion", "")) == "0":
                      router.append(model.get("id", ""))
          except Exception as e:
              print(f"::warning::OpenRouter model discovery failed: {e}")
          router = [m for m in router if m]
          if router:
              os.environ["OPENROUTER_MODELS"] = ",".join(router[:12])

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as f:
              for key in ("GEMINI_MODELS", "GROQ_MODELS", "GROQ_MODEL", "OPENROUTER_MODELS"):
                  if os.environ.get(key):
                      f.write(f"{key}={os.environ[key]}\n")
          print("Discovered Gemini models:", len(gemini), "Groq models:", len(groq), "free OpenRouter models:", len(router))
          PY

      - name: Generate complete episode script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_THINKING_BUDGET: "0"
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # Gemini -> Groq first; OpenRouter is the last resort because its
          # free quota may be exhausted and must not delay every episode.
          PREFER_OPENROUTER: "false"
          LLM_RETRIES: "2"
          LLM_INVALID_RETRIES: "2"
          LLM_DEADLINE_SECONDS: "900"
          LLM_REQUEST_TIMEOUT: "120"
          # Short, complete Arabic episodes are valid; do not reject a
          # coherent 150–360 word script and trigger another expensive LLM call.
          NARRATION_WORDS_MIN: "150"
          NARRATION_WORDS_MAX: "360"
          LLM_INITIAL_BUDGET: "3200"
          LLM_ROUNDS: "1"
          LLM_ROUND_COOLDOWN: "45"
        run: python scripts/generate_script.py

      - name: Arabic preflight gates (horror)
        env:
          EDGE_TTS_VOICE: "ar-SA-ZariyahNeural"
          TTS_ENGINE: "edge"
        run: |
          test -f state/current_episode.json || { echo "TEXT_GATE: episode artifact missing"; exit 1; }
          TEXT=$(python -c "import json; print(json.load(open('state/current_episode.json', encoding='utf-8')).get('narration',''))")
          python -m arabic_speech_core.cli preflight --text "$TEXT" --engine edge --locale ar-SA --voice "$EDGE_TTS_VOICE" --lexicon config/arabic_pronunciation.json --min-words 20 --max-words 1200

      - name: Fetch landscape stock clips
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: python scripts/fetch_clips.py

      - name: Generate complete narration with automatic SILMA horror voice and landscape subtitles
        env:
          TTS_ENGINE: "edge"
          EDGE_TTS_VOICES: "ar-SA-ZariyahNeural"
          EDGE_TTS_VOICE: "ar-SA-ZariyahNeural"
          SILMA_REFERENCE_PROFILE: "auto"
          SILMA_VOICE_PROFILES_FILE: "assets/voices/voice_profiles.json"
          AUTO_VOICE_PROFILES: "hossam,hossam_uploaded,marwan,nassim,ahmed_z"
          SILMA_SPEED: "1.00"
          SILMA_GUARD_ENABLED: "true"
          SILMA_GUARD_MIN_MATCH_WORDS: "3"
          SILMA_FALLBACK_TO_EDGE: "true"
          WHISPER_MODEL: "base"
          # Whisper can miss diacritics and proper names; keep empty/
          # foreign-audio checks while allowing minor alignment differences.
          ASR_MIN_MATCH_RATIO: "0.60"
          EDGE_TTS_RATE: "-8%"
          EDGE_TTS_PITCH: "-3Hz"
        run: python scripts/generate_voice.py

      - name: Assemble full landscape video and single vertical reel
        run: python scripts/assemble_video.py

      - name: Verify final montage and B-roll output
        run: |
          test -s output/final_video_full.mp4 || { echo "ERROR: full montage missing or empty"; exit 1; }
          test -s state/fetched_clips.json || { echo "ERROR: B-roll tracking manifest missing"; exit 1; }
          test "$(python -c 'import json; print(len(json.load(open("state/fetched_clips.json"))))')" -ge 4 || { echo "ERROR: fewer than 4 B-roll clips"; exit 1; }
          ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=p=0 output/final_video_full.mp4
          ffprobe -v error -show_entries format=duration -of csv=p=0 output/final_video_full.mp4
          echo "Professional landscape montage with topic-specific B-roll verified."

      - name: Run B-roll quality gate before Buffer
        run: |
          python scripts/broll_quality_pipeline.py \
            --video output/final_video_full.mp4 \
            --manifest state/fetched_clips.json \
            --expected landscape \
            --min-clips 4

      - name: Reserve unique topic before external publication
        if: ${{ !inputs.dry_run }}
        env:
          TOPIC_HISTORY_COMMIT: "true"
        run: python scripts/topic_history.py reserve --file state/topic_history.json --episode state/current_episode.json

      - name: Publish full video and reel together
        if: ${{ !inputs.dry_run }}
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_CHANNEL_ID: ${{ secrets.BUFFER_CHANNEL_ID }}
          BUFFER_YOUTUBE_CHANNEL_ID: ${{ secrets.BUFFER_YOUTUBE_CHANNEL_ID }}
          BUFFER_FACEBOOK_CHANNEL_ID: ${{ secrets.BUFFER_FACEBOOK_CHANNEL_ID }}
          BUFFER_INSTAGRAM_CHANNEL_ID: ${{ secrets.BUFFER_INSTAGRAM_CHANNEL_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # نفس القيمة تُستخدم للفيديو الكامل وللريل معًا، عشان ينشروا
          # سوا الساعة ~7م. غيّرها هنا لو غيّرت معاد الـ cron فوق.
          FULL_VIDEO_DELAY_HOURS: "8"
          CHANNEL_PENDING_LIMIT: "10"
        run: python scripts/publish_buffer.py

      # Buffer لا يدعم فيديوهات يوتيوب الطويلة (Long-form) إطلاقًا — يدعم
      # YouTube Shorts فقط، لذلك الفيديو الكامل يُنشر ليوتيوب هنا بشكل
      # منفصل عبر YouTube Data API مباشرة (شوف publish_youtube_direct.py).
      # FULL_VIDEO_DELAY_HOURS لازم تكون نفس قيمة الخطوة اللي فاتت، عشان
      # يوتيوب ينشر في نفس توقيت باقي المنصات (والريل) مساءً.
      - name: Publish full video directly to YouTube
        if: ${{ !inputs.dry_run }}
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_REFRESH_TOKEN_FALLBACK: ${{ secrets.YT_REFRESH_TOKEN_FALLBACK }}
          FULL_VIDEO_DELAY_HOURS: "8"
        run: python scripts/publish_youtube_direct.py

      - name: Mark topic as published in repository history
        if: ${{ !inputs.dry_run }}
        env:
          TOPIC_HISTORY_COMMIT: "true"
        run: python scripts/topic_history.py mark-published --file state/topic_history.json --episode state/current_episode.json

      # تحذير مبكر قبل انتهاء صلاحية YT_REFRESH_TOKEN (7 أيام لتطبيق في
      # وضع Testing عند Google) — بيفتح GitHub Issue قبل الموعد بأيام
      # أمان بدل ما ننتظر فشل النشر فعليًا. يشتغل دايمًا (always())، حتى
      # لو الخطوة اللي فاتت فشلت، عشان يفضل يقرأ آخر تاريخ نجاح معروف.
      - name: Check YouTube token age
        if: always()
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/check_youtube_token_age.py

      - name: Upload generated media artifacts
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: horror-episode-media-${{ github.run_id }}
          path: |
            output/final_video_full.mp4
            output/short_*.mp4
            state/current_episode.json
          retention-days: 14
          if-no-files-found: error

      - name: Commit clip tracking state only
        run: |
          git config user.name "content-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state/used_clips.json state/yt_token_last_success.json
          if git diff --cached --quiet; then
            echo "لا يوجد تغيير في حالة الكليبات"
            exit 0
          fi
          git commit -m "chore: update used clips tracking [skip ci]"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main && git push && exit 0
            echo "إعادة محاولة push رقم $attempt"
            sleep $((attempt * 5))
          done
          echo "فشل push بعد 5 محاولات"
          exit 1
