name: Create and Publish Horror Episode

on:
  schedule:
    # 09:00 UTC ≈ 12:00 ظهرًا بتوقيت القاهرة أثناء UTC+3.
    # ينشر الفيديو الكامل فورًا تقريبًا، ثم الشورتس بعد 3 و7 ساعات.
    - cron: "0 9 * * *"
  workflow_dispatch:

# يمنع تشغيل حلقتين في الوقت نفسه، ولا يلغي التشغيل الجاري.
concurrency:
  group: horror-episode-pipeline
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version
          ffprobe -version

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate complete episode script
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
          GROQ_REASONING_EFFORT: low
        run: python scripts/generate_script.py

      - name: Fetch landscape stock clips
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: python scripts/fetch_clips.py

      - name: Generate complete narration and landscape subtitles
        run: python scripts/generate_voice.py

      - name: Assemble full landscape video and platform shorts
        run: python scripts/assemble_video.py

      - name: Publish full video first, then shorts
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_CHANNEL_ID: ${{ secrets.BUFFER_CHANNEL_ID }}
          BUFFER_YOUTUBE_CHANNEL_ID: ${{ secrets.BUFFER_YOUTUBE_CHANNEL_ID }}
          BUFFER_FACEBOOK_CHANNEL_ID: ${{ secrets.BUFFER_FACEBOOK_CHANNEL_ID }}
          BUFFER_INSTAGRAM_CHANNEL_ID: ${{ secrets.BUFFER_INSTAGRAM_CHANNEL_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FULL_TO_SHORT_1_HOURS: "3"
          FULL_TO_SHORT_2_HOURS: "7"
          CHANNEL_PENDING_LIMIT: "10"
        run: python scripts/publish_buffer.py

      - name: Upload generated media artifacts
        uses: actions/upload-artifact@v5
        with:
          name: horror-episode-media-${{ github.run_id }}
          path: |
            output/final_video_full.mp4
            output/short_*.mp4
            state/current_episode.json
          retention-days: 14
          if-no-files-found: error

      - name: Commit clip tracking state only
        run: |
          git config user.name "content-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state/used_clips.json
          if git diff --cached --quiet; then
            echo "لا يوجد تغيير في حالة الكليبات"
            exit 0
          fi
          git commit -m "chore: update used clips tracking [skip ci]"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main && git push && exit 0
            echo "إعادة محاولة push رقم $attempt"
            sleep $((attempt * 5))
          done
          echo "فشل push بعد 5 محاولات"
          exit 1
