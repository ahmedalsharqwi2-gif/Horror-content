name: Arabic Guard CI
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
jobs:
  arabic-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Setup Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Run Arabic guard tests
        run: python -m unittest discover -s tests -p 'test_arabic_guard.py' -v
      - name: Verify test module import
        run: python -c "import tests.test_arabic_guard; print('test module import: OK')"
      - name: Quick syntax check
        run: python -m py_compile scripts/arabic_guard.py tests/test_arabic_guard.py
